name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd /var/www/portfolio-frontend
          git pull origin main

      - name: Install dependencies
        run: |
          cd /var/www/portfolio-frontend
          npm install

      - name: Build
        run: |
          cd /var/www/portfolio-frontend
          npm run build
